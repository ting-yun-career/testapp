<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP ScrollTrigger Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            overflow-x: hidden;
        }

        /* Hide scrollbar */
        html::-webkit-scrollbar {
            display: none;
        }
        html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Create scroll space */
        .scroll-container {
            height: 2000px;
            position: relative;
        }

        /* Fixed viewport container */
        .fixed-viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
        }

        h1 {
            position: fixed;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            font-size: 4rem;
            color: white;
            opacity: 0;
            text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            max-width: 80%;
        }

        /* Scroll indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
        }

        /* Scroll position indicator - Notion style */
        .scroll-position-indicator {
            position: fixed;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 100;
        }

        .scroll-line {
            width: 3px;
            height: 16px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1.5px;
            transition: background 0.15s ease;
        }

        .scroll-line.active {
            background: rgba(255, 255, 255, 0.6);
        }

        .scroll-line:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .scroll-line.active:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: white;
            width: 0%;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="progress-bar"></div>
    <div class="scroll-position-indicator" id="scrollIndicator"></div>
    
    <div class="scroll-container">
        <div class="fixed-viewport">
            <h1>Beautiful Scroll Animation</h1>
        </div>
    </div>

    <div class="scroll-indicator">
        <div>Scroll to see the magic ✨</div>
        <div id="scroll-position">Scroll: 0px</div>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Create scroll indicator lines
        const scrollIndicator = document.getElementById('scrollIndicator');
        const numberOfLines = 20;
        const lines = [];

        for (let i = 0; i < numberOfLines; i++) {
            const line = document.createElement('div');
            line.className = 'scroll-line';
            scrollIndicator.appendChild(line);
            lines.push(line);
        }

        // H1 fade in and out animation
        gsap.timeline({
            scrollTrigger: {
                trigger: ".scroll-container",
                start: "top top",
                end: "bottom bottom",
                scrub: 1,
                onUpdate: (self) => {
                    // Update scroll position indicator
                    const scrollPos = Math.round(self.progress * 2000);
                    document.getElementById('scroll-position').textContent = `Scroll: ${scrollPos}px`;
                    
                    // Update progress bar
                    document.querySelector('.progress-bar').style.width = (self.progress * 100) + '%';
                    
                    // Update Notion-style scroll indicator
                    const activeLineIndex = Math.floor(self.progress * numberOfLines);
                    lines.forEach((line, index) => {
                        if (index <= activeLineIndex) {
                            line.classList.add('active');
                        } else {
                            line.classList.remove('active');
                        }
                    });
                }
            }
        })
        .to("h1", {
            opacity: 1,
            duration: 0.2,
            ease: "none"
        }, 0.4)
        .to("h1", {
            opacity: 0,
            duration: 0.2,
            ease: "none"
        }, 0.6);

        // Optional: Add some extra visual feedback
        gsap.to('.scroll-indicator', {
            scrollTrigger: {
                trigger: ".scroll-container",
                start: "top top",
                end: "200px top",
                scrub: true
            },
            opacity: 0
        });
    </script>
</body>
</html>
